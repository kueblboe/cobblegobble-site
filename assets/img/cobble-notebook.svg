<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Cobble beside a notebook of three facts">
  <title>Cobble beside a notebook of three facts</title>
  <defs>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C7BDAE"/>
      <stop offset="1" stop-color="#8C8070"/>
    </linearGradient>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="120" cy="226" rx="62" ry="10" fill="#000" opacity="0.14"/>

  <!-- legs -->
  <rect x="81.6" y="184.8" width="19.2" height="33.6" rx="9.6" fill="#8C8070"/>
  <rect x="139.2" y="184.8" width="19.2" height="33.6" rx="9.6" fill="#8C8070"/>

  <!-- pebble body — mirrors App/Sources/MascotView.swift PebbleShape -->
  <path d="M120 31.2 C190.85 31.2 218.4 59.62 218.4 112.9 C218.4 173.28 186.91 208.8 123.94 208.8 C49.15 208.8 21.6 176.83 21.6 123.55 C21.6 63.17 53.09 31.2 120 31.2 Z"
        fill="url(#stone)" stroke="#8C8070" stroke-width="4.8" stroke-opacity="0.5"/>

  <!-- eyes -->
  <g>
    <circle cx="90" cy="90" r="12" fill="#291F1A"/>
    <circle cx="95.5" cy="85.5" r="4.5" fill="#fff"/>
    <circle cx="150" cy="90" r="12" fill="#291F1A"/>
    <circle cx="155.5" cy="85.5" r="4.5" fill="#fff"/>
  </g>

  <!-- wide, open, happy gobble mouth -->
  <path d="M79.2 114 L160.8 114 Q120 172.32 79.2 114 Z" fill="#4D332E"/>
  <ellipse cx="120" cy="146.76" rx="20.4" ry="9" fill="#DB6B70"/>

  <!-- notebook — three facts, written down before Cobble forgets, which it never does -->
  <g id="accessory-notebook" transform="rotate(-8 40 198)">
    <rect x="10" y="160" width="60" height="76" rx="6" fill="#C7BDAE" stroke="#8C8070" stroke-width="4"/>
    <line x1="10" y1="172" x2="10" y2="224" stroke="#8C8070" stroke-width="4" stroke-dasharray="2 6" stroke-linecap="round"/>
    <line x1="22" y1="180" x2="58" y2="180" stroke="#4D332E" stroke-width="4" stroke-linecap="round"/>
    <line x1="22" y1="196" x2="58" y2="196" stroke="#4D332E" stroke-width="4" stroke-linecap="round"/>
    <line x1="22" y1="212" x2="46" y2="212" stroke="#4D332E" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
